version: 2

project_name: kubepilot

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: kubepilot
    main: .
    binary: kubepilot
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - package_name: kubepilot
    vendor: Scensei
    homepage: https://github.com/scensei-articles/kubepilot
    maintainer: Aleksander Wojnarowicz <aleksander@scensei.com>
    description: |-
      KubePilot - Kubernetes pod management CLI
      Interactive port forwarding, shell access, and log streaming for Kubernetes pods.
    license: MIT
    formats:
      - deb
    bindir: /usr/local/bin

checksum:
  name_template: checksums.txt
  algorithm: sha256

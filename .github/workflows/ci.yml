name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: kube-pilot/go.mod

      - name: Run tests
        run: go test ./...
        working-directory: kube-pilot

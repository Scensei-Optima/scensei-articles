name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: kube-pilot/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
          workdir: kube-pilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: kube-pilot/dist/*.deb
          retention-days: 1

  apt-repo:
    name: Update apt repository
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout or create gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages; then
            git clone --depth=1 --branch=gh-pages "$REPO_URL" apt-repo
          else
            mkdir apt-repo && cd apt-repo
            git init
            git remote add origin "$REPO_URL"
            git checkout -b gh-pages
          fi

      - uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: /tmp/deb-packages

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --import

      - name: Install packaging tools
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Update repository
        working-directory: apt-repo
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          mkdir -p pool/stable/main dists/stable/main/binary-amd64 dists/stable/main/binary-arm64

          cp /tmp/deb-packages/*.deb pool/stable/main/

          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool/stable/main \
              > dists/stable/main/binary-$arch/Packages
            gzip -9 -k -f dists/stable/main/binary-$arch/Packages
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="KubePilot" \
            -o APT::FTPArchive::Release::Label="KubePilot" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release

          KEY_ID=$(gpg --list-secret-keys --keyid-format=long \
            | grep '^sec' | awk '{print $2}' | cut -d'/' -f2 | head -1)

          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback \
            -abs -u "$KEY_ID" -o dists/stable/Release.gpg dists/stable/Release

          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback \
            --clearsign -u "$KEY_ID" -o dists/stable/InRelease dists/stable/Release

          gpg --armor --export "$KEY_ID" > gpg.key

      - name: Commit and push
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "apt: ${{ github.ref_name }}"
          git push origin gh-pages

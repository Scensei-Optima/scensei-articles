name: Build and Upload Release Artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            binary: kubepilot
            archive: kubepilot-linux-${{ github.event.release.tag_name }}.tar.gz
            pack: tar -czf kubepilot-linux-${{ github.event.release.tag_name }}.tar.gz kubepilot
          - os: macos-latest
            goos: darwin
            binary: kubepilot
            archive: kubepilot-macos-${{ github.event.release.tag_name }}.tar.gz
            pack: tar -czf kubepilot-macos-${{ github.event.release.tag_name }}.tar.gz kubepilot
          - os: windows-latest
            goos: windows
            binary: kubepilot.exe
            archive: kubepilot-windows-${{ github.event.release.tag_name }}.zip
            pack: Compress-Archive -Path kubepilot.exe -DestinationPath kubepilot-windows-${{ github.event.release.tag_name }}.zip

    steps:
      - name: Check out code
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary (Linux/macOS)
        if: matrix.goos != 'windows'
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/${{ matrix.binary }} .
        working-directory: kube-pilot

      - name: Build binary (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -ldflags="-s -w" -o dist/${{ matrix.binary }} .
        working-directory: kube-pilot

      - name: Package binary (Linux/macOS)
        if: matrix.goos != 'windows'
        run: ${{ matrix.pack }}
        working-directory: kube-pilot/dist

      - name: Package binary (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: ${{ matrix.pack }}
        working-directory: kube-pilot/dist

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: kube-pilot/dist/${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
